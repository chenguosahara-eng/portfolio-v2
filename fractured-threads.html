<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractured Threads · 信息极化批判性设计游戏 — Reese G Chen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0c;
    --bg-elevated: #111114;
    --border: #202024;
    --border-soft: #1a1a1e;
    --text-primary: #f2f2ef;
    --text-secondary: #9a9aa2;
    --text-tertiary: #58585e;
    --accent: #4a92ff;
    --accent-soft: rgba(74, 146, 255, 0.14);
    --font-display: 'Manrope', 'Noto Sans SC', sans-serif;
    --font-body: 'Inter', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow: hidden;
  }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .cn-inline {
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  .back-link {
    position: fixed;
    top: 28px;
    left: 88px;
    z-index: 20;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .back-link:hover { color: var(--text-primary); }

  .deck {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
  }

  .page {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 88px 96px 56px 160px;
    position: relative;
    border-bottom: 1px solid var(--border-soft);
  }

  @media (max-width: 860px) {
    .page { padding: 76px 20px 48px 64px; }
  }

  .slide-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--text-tertiary);
    width: 100%;
    max-width: 1400px;
  }

  .slide-label .slide-number {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .slide-label .slide-title {
    color: var(--text-secondary);
    font-weight: 500;
  }

  .page-visual {
    width: 100%;
    max-width: 1400px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-soft);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
    flex-shrink: 1;
    min-height: 0;
  }

  .page-visual img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #0a0a0c;
  }

  .page-index {
    position: absolute;
    top: 40px;
    right: 96px;
    font-size: 12px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .page-nav {
    position: fixed;
    left: 32px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .nav-arrow {
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 4px;
    display: flex;
    transition: color 0.15s ease;
  }

  .nav-arrow:hover { color: var(--text-primary); }
  .nav-arrow svg { width: 14px; height: 14px; }

  .nav-dashes {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 0;
  }

  .dash {
    width: 18px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.22);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: all 0.25s ease;
  }

  .dash:hover { background: rgba(255, 255, 255, 0.45); }

  .dash.active {
    width: 28px;
    height: 3px;
    background: var(--accent);
  }

  .nav-dashes:hover .dash:not(:hover):not(:focus-visible):not(.active) {
    opacity: 0.3;
    filter: blur(0.4px);
  }

  .preview-card {
    position: fixed;
    left: 76px;
    z-index: 40;
    width: 220px;
    padding: 16px 18px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.65);
    opacity: 0;
    transform: translateY(calc(-50% + 10px));
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
  }

  .preview-card.visible {
    opacity: 1;
    transform: translateY(-50%);
  }

  .preview-card .pv-index {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }

  .preview-card .pv-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .preview-card .pv-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  @media (max-width: 860px) {
    .preview-card { display: none; }
  }

  .page-counter {
    position: fixed;
    bottom: 32px;
    left: 32px;
    z-index: 30;
    font-size: 12px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .page-counter .current { color: var(--text-primary); font-weight: 600; }

  .restart-btn {
    position: fixed;
    bottom: 28px;
    right: 32px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 10px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--text-secondary);
    font-size: 13px;
    font-family: var(--font-body);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .restart-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
  .restart-btn svg { width: 15px; height: 15px; }

  .restart-btn .key {
    font-size: 11px;
    color: var(--text-tertiary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    line-height: 1.5;
  }

  @media (max-width: 860px) {
    .restart-btn .cn-inline { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .dash { transition: none; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 返回首页 <span class="cn-inline">Home</span></a>

<nav class="page-nav" aria-label="Page navigation">
  <button class="nav-arrow" id="navUp" aria-label="上一页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
  </button>
  <div class="nav-dashes" id="navDashes">
    <button class="dash" data-target="page-1" data-index="01" data-title="封面" data-desc="Fractured Threads · 信息极化批判性设计游戏" aria-label="第 1 页:封面"></button>
    <button class="dash" data-target="page-2" data-index="02" data-title="用户研究" data-desc="访谈发现、理论依据与灵感来源" aria-label="第 2 页:用户研究"></button>
    <button class="dash" data-target="page-3" data-index="03" data-title="游戏设计" data-desc="机制流程、场景草图与四位主角设定" aria-label="第 3 页:游戏设计"></button>
    <button class="dash" data-target="page-4" data-index="04" data-title="游戏空间" data-desc="五个核心场景的平面全景图" aria-label="第 4 页:游戏空间"></button>
    <button class="dash" data-target="page-5" data-index="05" data-title="游戏流程" data-desc="16格分镜完整玩家旅程" aria-label="第 5 页:游戏流程"></button>
  </div>
  <button class="nav-arrow" id="navDown" aria-label="下一页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</nav>

<div class="preview-card" id="previewCard" aria-hidden="true">
  <div class="pv-index" id="pvIndex">01</div>
  <div class="pv-title" id="pvTitle">封面</div>
  <div class="pv-desc" id="pvDesc">Fractured Threads · 信息极化批判性设计游戏</div>
</div>

<div class="page-counter"><span class="current" id="counterCurrent">1</span> / 5</div>

<button class="restart-btn" id="restartBtn" aria-label="回到第一页 Restart">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  <span class="cn-inline" style="color: inherit;">回到开头</span>
  <span class="key">R</span>
</button>

<div class="deck" id="deck">

  <section class="page" id="page-1">
    <div class="slide-label"><span class="slide-number">01 / 05</span><span class="slide-title">封面</span></div>
    <div class="page-visual"><img src="fractured-threads/1.jpg" alt="Fractured Threads · 封面" loading="lazy"></div>
  </section>

  <section class="page" id="page-2">
    <div class="slide-label"><span class="slide-number">02 / 05</span><span class="slide-title">用户研究</span></div>
    <div class="page-visual"><img src="fractured-threads/2.jpg" alt="用户研究:访谈发现与理论依据" loading="lazy"></div>
  </section>

  <section class="page" id="page-3">
    <div class="slide-label"><span class="slide-number">03 / 05</span><span class="slide-title">游戏设计</span></div>
    <div class="page-visual"><img src="fractured-threads/3.jpg" alt="游戏设计:机制、场景与角色设定" loading="lazy"></div>
  </section>

  <section class="page" id="page-4">
    <div class="slide-label"><span class="slide-number">04 / 05</span><span class="slide-title">游戏空间</span></div>
    <div class="page-visual"><img src="fractured-threads/4.jpg" alt="游戏空间平面全景图" loading="lazy"></div>
  </section>

  <section class="page" id="page-5">
    <div class="slide-label"><span class="slide-number">05 / 05</span><span class="slide-title">游戏流程</span></div>
    <div class="page-visual"><img src="fractured-threads/5.jpg" alt="游戏流程分镜" loading="lazy"></div>
  </section>

</div>

<script>
  const deck = document.getElementById('deck');
  const pages = Array.from(document.querySelectorAll('.page'));
  const dashes = Array.from(document.querySelectorAll('.dash'));
  const counterCurrent = document.getElementById('counterCurrent');

  function setActive(index) {
    dashes.forEach((d, i) => d.classList.toggle('active', i === index));
    counterCurrent.textContent = index + 1;
  }

  dashes.forEach((dash, i) => {
    dash.addEventListener('click', () => {
      pages[i].scrollIntoView({ behavior: 'smooth' });
    });
  });

  const previewCard = document.getElementById('previewCard');
  const pvIndex = document.getElementById('pvIndex');
  const pvTitle = document.getElementById('pvTitle');
  const pvDesc = document.getElementById('pvDesc');

  function showPreview(dash) {
    const rect = dash.getBoundingClientRect();
    pvIndex.textContent = dash.dataset.index;
    pvTitle.textContent = dash.dataset.title;
    pvDesc.textContent = dash.dataset.desc;
    previewCard.style.top = (rect.top + rect.height / 2) + 'px';
    previewCard.classList.add('visible');
  }

  function hidePreview() {
    previewCard.classList.remove('visible');
  }

  dashes.forEach((dash) => {
    dash.addEventListener('mouseenter', () => showPreview(dash));
    dash.addEventListener('mouseleave', hidePreview);
    dash.addEventListener('focus', () => showPreview(dash));
    dash.addEventListener('blur', hidePreview);
  });

  document.getElementById('navUp').addEventListener('click', () => {
    const current = dashes.findIndex(d => d.classList.contains('active'));
    const prev = Math.max(0, current - 1);
    pages[prev].scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('navDown').addEventListener('click', () => {
    const current = dashes.findIndex(d => d.classList.contains('active'));
    const next = Math.min(pages.length - 1, current + 1);
    pages[next].scrollIntoView({ behavior: 'smooth' });
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const index = pages.indexOf(entry.target);
        setActive(index);
      }
    });
  }, { root: deck, threshold: 0.6 });

  pages.forEach(p => observer.observe(p));

  document.addEventListener('keydown', (e) => {
    const current = dashes.findIndex(d => d.classList.contains('active'));
    if (e.key === 'ArrowDown' || e.key === 'PageDown') {
      e.preventDefault();
      const next = Math.min(pages.length - 1, current + 1);
      pages[next].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      const prev = Math.max(0, current - 1);
      pages[prev].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'r' || e.key === 'R') {
      pages[0].scrollIntoView({ behavior: 'smooth' });
    }
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    pages[0].scrollIntoView({ behavior: 'smooth' });
  });

  setActive(0);
</script>

</body>
</html>
